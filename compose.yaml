services:
  # ================= BASE DE DATOS (MySQL) =================
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pass
    ports:
      - "3307:3306"
      #dads
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppass"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [campuslab-net]

  # ================= MENSAJERÍA (RabbitMQ) =================
  rabbitmq-1:
    image: rabbitmq:3-management
    container_name: rabbitmq-1
    restart: unless-stopped
    hostname: rabbitmq-1
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [campuslab-net]

  # ================= MICROSERVICIOS DE DOMINIO =================
  ms-campuslab-bookings:
    build: ../ms-campuslab-bookings
    container_name: ms-campuslab-bookings
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bookings_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pass
      SPRING_RABBITMQ_HOST: rabbitmq-1
      AUDIT_SERVICE_URL: http://ms-campuslab-audit:8085
    ports:
      - "8081:8081"
    depends_on:
      mysql-db: { condition: service_healthy }
      rabbitmq-1: { condition: service_healthy }
    networks: [campuslab-net]

  ms-campuslab-catalog:
    build: ../ms-campuslab-catalog
    container_name: ms-campuslab-catalog
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/catalog_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pass
      SPRING_RABBITMQ_HOST: rabbitmq-1
    ports:
      - "8082:8082"
    depends_on:
      mysql-db: { condition: service_healthy }
      rabbitmq-1: { condition: service_healthy }
    networks: [campuslab-net]

  ms-campuslab-notify:
    build: ../ms-campuslab-notify
    container_name: ms-campuslab-notify
    restart: unless-stopped
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq-1
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq-1: { condition: service_healthy }
    networks: [campuslab-net]

  ms-campuslab-report:
    build: ../ms-campuslab-report
    container_name: ms-campuslab-report
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bookings_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pass
    ports:
      - "8084:8084"
    depends_on:
      mysql-db: { condition: service_healthy }
    networks: [campuslab-net]

  ms-campuslab-audit:
    build: ../ms-campuslab-audit
    container_name: ms-campuslab-audit
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/audit_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pass
    ports:
      - "8085:8085"
    depends_on:
      mysql-db: { condition: service_healthy }
    networks: [campuslab-net]

# ================= CAPA DE ACCESO Y FRONTEND =================
  ms-campuslab-bff:
    build: ../ms-campuslab-bff
    container_name: ms-campuslab-bff
    restart: unless-stopped
    environment:
      # Relaxed binding: SERVICES_BOOKINGSURL -> services.bookings-url
      SERVICES_BOOKINGSURL: http://ms-campuslab-bookings:8081
      SERVICES_AUDITURL: http://ms-campuslab-audit:8085
      SERVICES_REPORTURL: http://ms-campuslab-report:8084
      SERVICES_CATALOGURL: http://ms-campuslab-catalog:8082
      SERVICES_NOTIFYURL: http://ms-campuslab-notify:8083
    ports:
      - "8080:8080"
    depends_on:
      - ms-campuslab-bookings
      - ms-campuslab-catalog
      - ms-campuslab-notify
      - ms-campuslab-report
      - ms-campuslab-audit
    networks: [campuslab-net]

  frontend-campuslab:
    build: ../ngfrontend-campuslab
    container_name: frontend-campuslab
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - ms-campuslab-bff
    networks: [campuslab-net]
    
volumes:
  mysql-data:

networks:
  campuslab-net:
    external: true