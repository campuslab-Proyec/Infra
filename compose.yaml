services:
  # ================= BASE DE DATOS (MySQL) =================
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pass
    # Sin "ports": solo accesible dentro de campuslab-net
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppass"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [campuslab-net]

  # ================= MENSAJERÍA (RabbitMQ, clúster de 2 nodos) =================
  # Ambos nodos comparten la Erlang cookie y rabbitmq/cluster.conf (peer discovery "classic config"),
  # así forman el clúster solos al arrancar. Verificar: docker exec rabbitmq-2 rabbitmqctl cluster_status
  rabbitmq-1:
    image: rabbitmq:3-management
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: campuslab-rabbitmq-cluster-cookie
    volumes:
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    ports:
      - "127.0.0.1:15672:15672"   # UI de gestión, solo accesible desde la propia máquina
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [campuslab-net]

  rabbitmq-2:
    image: rabbitmq:3-management
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: campuslab-rabbitmq-cluster-cookie
    volumes:
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    ports:
      - "127.0.0.1:15673:15672"   # UI del segundo nodo
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [campuslab-net]

  # ================= MICROSERVICIOS DE DOMINIO =================
  ms-campuslab-bookings:
    build: ../ms-campuslab-bookings
    container_name: ms-campuslab-bookings
    restart: unless-stopped
    environment:
      # Solo IPv4: la red de Docker no tiene IPv6 y Java fallaba al bajar las claves de Entra ID (401).
      # Hora de Chile: el frontend envía fechas locales sin zona; en UTC "@Future" las rechazaba (400)
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true -Duser.timezone=America/Santiago
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bookings_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pass
      # Los dos nodos del clúster: si uno cae, el cliente se reconecta al otro
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      AUDIT_SERVICE_URL: http://ms-campuslab-audit:8085
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    networks: [campuslab-net]

  ms-campuslab-catalog:
    build: ../ms-campuslab-catalog
    container_name: ms-campuslab-catalog
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true -Duser.timezone=America/Santiago
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/catalog_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pass
      # Los dos nodos del clúster: si uno cae, el cliente se reconecta al otro
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    networks: [campuslab-net]

  ms-campuslab-notify:
    build: ../ms-campuslab-notify
    container_name: ms-campuslab-notify
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true -Duser.timezone=America/Santiago
      # Los dos nodos del clúster: si uno cae, el cliente se reconecta al otro
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      # API de management (listado de colas/exchanges/bindings en el panel de administración)
      CAMPUSLAB_RABBITMQ_MANAGEMENT_URL: http://rabbitmq-1:15672
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    networks: [campuslab-net]

  ms-campuslab-report:
    build: ../ms-campuslab-report
    container_name: ms-campuslab-report
    restart: unless-stopped   # reintenta si bookings_db aún no existe
    environment:
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true -Duser.timezone=America/Santiago
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bookings_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pass
    depends_on:
      mysql-db:
        condition: service_healthy
      ms-campuslab-bookings:
        condition: service_started
    networks: [campuslab-net]

  ms-campuslab-audit:
    build: ../ms-campuslab-audit
    container_name: ms-campuslab-audit
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true -Duser.timezone=America/Santiago
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/audit_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pass
    depends_on:
      mysql-db:
        condition: service_healthy
    networks: [campuslab-net]

  # ================= CAPA DE ACCESO Y FRONTEND =================
  ms-campuslab-bff:
    build: ../ms-campuslab-bff
    container_name: ms-campuslab-bff
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true -Duser.timezone=America/Santiago
      # Usuarios sin App Role cuyo correo es de estos dominios entran como Docente (separados por comas; vacío = desactivado)
      CAMPUSLAB_SECURITY_DOCENTE_DOMAINS: duocuc.cl
    # Sin "ports": el navegador llega al BFF solo a través de /api en el nginx del frontend
    depends_on:
      ms-campuslab-bookings:
        condition: service_started
      ms-campuslab-catalog:
        condition: service_started
      ms-campuslab-report:
        condition: service_started
      ms-campuslab-audit:
        condition: service_started
      ms-campuslab-notify:
        condition: service_started
    networks: [campuslab-net]

  frontend-campuslab:
    build: ${FRONTEND_DIR:-../frontend-campuslab}   # carpeta del frontend; en EC2 se puede cambiar con FRONTEND_DIR en .env
    container_name: frontend-campuslab
    restart: unless-stopped
    environment:
      # URL del API Gateway de AWS (p. ej. https://abc123.execute-api.us-east-1.amazonaws.com).
      # Vacía = el frontend llama al BFF por su mismo origen. Se define en Infra/.env (no versionado).
      API_BASE_URL: ${API_BASE_URL:-}
    ports:
      - "80:80"                      # ngrok apunta aquí
    depends_on:
      ms-campuslab-bff:
        condition: service_started
    networks: [campuslab-net]

volumes:
  mysql-data:

networks:
  campuslab-net:
    driver: bridge