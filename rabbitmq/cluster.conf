## Clúster de 2 nodos con descubrimiento "classic config": al arrancar en limpio, cada nodo
## se une a los demás de esta lista. Ambos necesitan la misma Erlang cookie (ver compose.yaml).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
